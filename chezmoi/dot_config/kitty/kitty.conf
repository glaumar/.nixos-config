# kitty — managed via chezmoi (chezmoi/dot_config/kitty/kitty.conf).
# Gruvbox Dark palette, kept from the previous Ghostty theme of the same name.

background            #282828
foreground            #ebdbb2
cursor                #ebdbb2
selection_background  #665c54
selection_foreground  #ebdbb2

color0  #282828
color8  #928374
color1  #cc241d
color9  #fb4934
color2  #98971a
color10 #b8bb26
color3  #d79921
color11 #fabd2f
color4  #458588
color12 #83a598
color5  #b16286
color13 #d3869b
color6  #689d6a
color14 #8ec07c
color7  #a89984
color15 #ebdbb2

# niri draws no server-side decorations, so hide kitty's client-side titlebar.
hide_window_decorations yes

# Semi-transparent background so niri's blur behind the window shows through.
background_opacity 0.85
