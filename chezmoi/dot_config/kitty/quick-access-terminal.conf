# kitty quick access terminal (drop-down) — managed via chezmoi.
# Toggled by Mod+Return in niri (see chezmoi/dot_config/niri/kitty.kdl).
#
# NOTE: kitty config files are whitespace-separated "key value". An '=' here
# makes the line invalid and kitty silently ignores it (the `name=value` form is
# only for the CLI `-o`/`--override`).

# Centered, ~85% of the screen. kitty has no percentage sizing, so this anchors
# the panel to every edge (`edge center`) and insets it with pixel margins:
# 7.5% of the main display's logical size (2560x1440 -> 192 x 108). Margins are
# in logical pixels, so on the 1920x1080 monitor the panel ends up ~80%; pin
# `output_name` to make 85% exact on a single output.
edge center
margin_left 192
margin_right 192
margin_top 108
margin_bottom 108
hide_on_focus_loss yes
background_opacity 0.85
