# This example uses YAML anchors which allows reuse of multiple keys
# without having to repeat yourself.
# Also see https://github.com/Mic92/dotfiles/blob/master/nixos/.sops.yaml
# for a more complex example.
keys:
  # /home/glaumar/.config/sops/age/keys.txt
  - &desktop age1eaxt06lu4h8cr2m6dgvlgzfg3amaqw9qdeynhs4nsfaum4nxz4tqm54dnt
  # backup age key
  - &backup age18hjs9j7kxfkc8uxw0hu3sms5n2ndva7dwxs8s678r5lrmkyhwe7spplwfc
creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *desktop
          - *backup

  - path_regex: (/etc|secrets)/daed/wing.db$
    key_groups:
      - age:
          - *desktop
          - *backup